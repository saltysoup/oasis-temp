apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: b40-ccc
spec:
  activeMigration:
    optimizeRulePriority: false
  priorities:
  - machineType: g4-standard-48
    storage:
      localSSDCount: 4
  - nodepools: ['b40-ondemand-ccc']
  - gpu:
      type: "nvidia-rtx-pro-6000"
      count: 1
      driverVersion: "latest"
  - machineType: g4-standard-48
    storage:
      localSSDCount: 4
  - nodepools: ['b40-spot-ccc']
  - gpu:
      type: "nvidia-rtx-pro-6000"
      count: 1
      driverVersion: "latest"
    spot: true
  - machineType: g4-standard-48
    storage:
      localSSDCount: 4
  - nodepools: ['b40-dws-ccc']
  - gpu:
      type: "nvidia-rtx-pro-6000"
      count: 1
      driverVersion: "latest"
  - flexStart:
      enabled: true