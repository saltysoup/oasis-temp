apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rayjob-test
spec:
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
  entrypoint: |
    python -c "
    import ray, torch, os
    ray.init()

    @ray.remote(num_gpus=8)
    def check_gpu():
        return f'Host: {os.uname()[1]}, GPUs detected: {torch.cuda.device_count()}'

    print(ray.get(check_gpu.remote()))
    "
  runtimeEnvYAML: |
    pip:
      - torch==2.7.1
    env_vars:
      NCCL_DEBUG: "INFO"
      NCCL_DEBUG_SUBSYS: "INIT,NET"
  rayClusterSpec:
    enableInTreeAutoscaling: true
    autoscalerOptions:
      idleTimeoutSeconds: 3600
    rayVersion: '2.48.0'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
            gke-gcsfuse/cpu-limit: "0"
            gke-gcsfuse/memory-limit: "0"
            gke-gcsfuse/ephemeral-storage-limit: "0"
        spec:
          restartPolicy: Never
          serviceAccountName: "oasis-ray"
          nodeSelector:
            cloud.google.com/gke-nodepool: "default-pool"
          containers:
          - name: ray-head
            image: <yourImage> #us-south1-docker.pkg.dev/gpu-launchpad-playground/ikwak-oasis-test/raycluster:latest
            env:
            - name: RAY_enable_autoscaler_v2
              value: "1"
            ports:
            - containerPort: 6379
              name: gcs-server
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            resources:
              limits:
                cpu: "8"
                memory: "16G"
                ephemeral-storage: "9Gi"
              requests:
                cpu: "8"
                memory: "16G"
                ephemeral-storage: "9Gi"
            volumeMounts:
              - name: ray-logs
                mountPath: /tmp/ray
              - name: gcs-fuse-csi-eph
                mountPath: /bucket
          volumes:
            - name: ray-logs
              emptyDir: {}
            - name: gcs-fuse-csi-eph
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: <yourBucket> #ikwak-stuff
                  gcsfuseMetadataPrefetchOnMount: "true"
                  mountOptions: "implicit-dirs,file-mode=777,dir-mode=777,file-cache:enable-parallel-downloads:true,file-cache:cache-file-for-range-read:true,file-cache:max-size-mb:-1,write:enable-streaming-writes:true,read_ahead_kb=1024,file-system:kernel-list-cache-ttl-secs:-1"
    workerGroupSpecs:
    - replicas: 2
      minReplicas: 0
      maxReplicas: 10
      groupName: gpu-group
      rayStartParams:
        num-cpus: "220"
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
            gke-gcsfuse/cpu-limit: "0"
            gke-gcsfuse/memory-limit: "0"
            gke-gcsfuse/ephemeral-storage-limit: "0"
            networking.gke.io/default-interface: 'eth0'
            networking.gke.io/interfaces: |
              [
                {"interfaceName":"eth0","network":"default"},
                {"interfaceName":"eth1","network":"gvnic-1"},
                {"interfaceName":"eth2","network":"rdma-0"},
                {"interfaceName":"eth3","network":"rdma-1"},
                {"interfaceName":"eth4","network":"rdma-2"},
                {"interfaceName":"eth5","network":"rdma-3"},
                {"interfaceName":"eth6","network":"rdma-4"},
                {"interfaceName":"eth7","network":"rdma-5"},
                {"interfaceName":"eth8","network":"rdma-6"},
                {"interfaceName":"eth9","network":"rdma-7"}
              ]
        spec:
          restartPolicy: Never
          serviceAccountName: "oasis-ray"
          nodeSelector:
            cloud.google.com/compute-class: "h200-ccc"
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          containers:
          - name: ray-worker
            image: <yourImage> #us-south1-docker.pkg.dev/gpu-launchpad-playground/ikwak-oasis-test/raycluster:latest
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            command: ["source /usr/local/gib/scripts/set_nccl_env.sh"]            
            resources:
              limits:
                cpu: "220"
                memory: "2800Gi"
                nvidia.com/gpu: "8"
                ephemeral-storage: "1000Gi"
              requests:
                cpu: "220"
                memory: "2800Gi"
                nvidia.com/gpu: "8"
                ephemeral-storage: "1000Gi"
            volumeMounts:
            - name: nvidia
              mountPath: /usr/local/nvidia
            - name: gib
              mountPath: /usr/local/gib
            - name: shared-memory
              mountPath: /dev/shm
            - name: ray-tmp-storage
              mountPath: /tmp
            - name: gcs-fuse-csi-eph
              mountPath: /bucket
          volumes:
          - name: gib
            hostPath:
              path: /home/kubernetes/bin/gib
          - name: nvidia
            hostPath:
              path: /home/kubernetes/bin/nvidia
          - name: lib64
            hostPath:
              path: /lib64
          - name: shared-memory
            emptyDir:
              medium: "Memory"
              sizeLimit: 250Gi
          - name: sys
            hostPath:
              path: /sys
          - name: proc-sys
            hostPath:
              path: /proc/sys
          - name: ray-tmp-storage
            emptyDir: {}
          - name: gcs-fuse-csi-eph
            csi:
              driver: gcsfuse.csi.storage.gke.io
              volumeAttributes:
                bucketName: <yourBucket> #ikwak-stuff
                gcsfuseMetadataPrefetchOnMount: "true"
                mountOptions: "implicit-dirs,file-mode=777,dir-mode=777,file-cache:enable-parallel-downloads:true,file-cache:cache-file-for-range-read:true,file-cache:max-size-mb:-1,write:enable-streaming-writes:true,read_ahead_kb=1024,file-system:kernel-list-cache-ttl-secs:-1"
